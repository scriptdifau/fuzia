name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Crea le versioni leggere delle foto
        run: |
          pip install --quiet pillow
          python tools/make-variants.py
          # rete di sicurezza: se index.html cita una versione -900 che non esiste, la pubblicazione si ferma (il sito resta com'è)
          for f in $(grep -oE 'assets/img/[A-Za-z0-9_-]+-900\.jpg' index.html | sort -u); do
            test -f "$f" || { echo "Manca $f"; exit 1; }
          done
      - name: Prepara i file del sito
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'design' --exclude 'tools' --exclude '_site' --exclude 'README.md' --exclude '.gitignore' ./ _site/
          touch _site/.nojekyll
          # evita che il browser usi vecchie copie di stili, script e immagini: aggiunge ?v=<codice versione> ai riferimenti
          V=${GITHUB_SHA::7}
          sed -i -E "s#(css/style\.css|js/main\.js|js/motion\.js)\"#\1?v=${V}\"#g; s#(assets/img/[A-Za-z0-9_-]+\.(jpg|svg))#\1?v=${V}#g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
